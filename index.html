<!DOCTYPE html>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  font-family:monospace;

/* =========================
   TELA PARA VIRAR CELULAR
========================= */

#rotate{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#101010;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

#rotate .phone{
  font-size:65px;
  animation:rotatePhone 1s infinite alternate;
}

#rotate h1{
  margin-top:15px;
  color:#e5c36a;
  font-size:22px;
}

#rotate p{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
}

@keyframes rotatePhone{
  from{transform:rotate(0deg)}
  to{transform:rotate(90deg)}
}

/* =========================
   JOGO
========================= */

#gameContainer{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  width:100dvw;
  height:100dvh;
  background:#000;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  display:block;
  width:100vw;
  height:100vh;
  width:100dvw;
  height:100dvh;

  object-fit:fill;

  image-rendering:pixelated;
  image-rendering:crisp-edges;

  background:#000;
}

/* =========================
   CONTROLES EMULADOR
========================= */

#controls{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#dpad{
  position:absolute;
  left:3vw;
  bottom:4vh;
  width:150px;
  height:150px;
  pointer-events:none;
}

.pad{
  position:absolute;

  width:52px;
  height:52px;

  border:3px solid #888;
  border-radius:9px;

  background:linear-gradient(#555,#222);

  color:#fff;
  font-size:27px;
  font-weight:bold;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 5px 0 #111;

  pointer-events:auto;
  touch-action:none;
}

.pad:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #111;
  background:#777;
}

#up{
  left:49px;
  top:0;
}

#down{
  left:49px;
  bottom:0;
}

#left{
  left:0;
  top:49px;
}

#right{
  right:0;
  top:49px;
}

/* =========================
   A / B
========================= */

#buttons{
  position:absolute;
  right:4vw;
  bottom:5vh;

  width:165px;
  height:135px;

  pointer-events:none;
}

.action{
  position:absolute;

  width:70px;
  height:70px;

  border-radius:50%;
  border:4px solid #888;

  background:linear-gradient(#555,#222);

  color:white;
  font-size:28px;
  font-weight:bold;

  box-shadow:0 6px 0 #111;

  pointer-events:auto;
  touch-action:none;
}

.action:active{

  box-shadow:0 1px 0 #111;
}

#A{
  right:0;
  top:0;
}

#B{
  left:0;
  bottom:0;
}

/* INVENTÁRIO */

#inventoryButton{

  top:4vh;
  right:4vw;

  width:48px;
  height:42px;

  border:3px solid #777;
  border-radius:8px;

  background:#222;
  color:#fff;

  font-size:19px;
  font-weight:bold;

  pointer-events:auto;
  touch-action:none;

/* =========================
   PORTRAIT
========================= */

@media (orientation:portrait){

  #rotate{
    display:flex;
  }

  #gameContainer{
    display:none;
  }
}
</style>
</head>

async function enterFullscreen(){

  try{

    const element=document.documentElement;

    if(!document.fullscreenElement){

      if(element.requestFullscreen){
        await element.requestFullscreen();
      }

      else if(element.webkitRequestFullscreen){
        element.webkitRequestFullscreen();
      }

    }

  }catch(error){

    console.log("Fullscreen não disponível:",error);

  }

  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation.lock("landscape");

    }

  }catch(error){

    console.log("Orientação automática não disponível.");

  }
}

function rect(x,y,w,h,color){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.floor(x),
    Math.floor(y),
    w,
    h
  );

}

function text(t,x,y,size=10,color="#fff"){

  ctx.fillStyle=color;
  ctx.font=size+"px monospace";

  ctx.fillText(
    t,
    Math.floor(x),
    Math.floor(y)
  );

}

function bar(x,y,w,h,value,max,color){

  rect(x,y,w,h,"#111");

  rect(
    x,
    y,
    Math.max(0,w*(value/max)),
    h,
    color
  );

  ctx.strokeStyle="#000";
  ctx.strokeRect(x,y,w,h);

}

/* =========================
   MOVIMENTO
========================= */

function movePlayer(){

  if(state!=="world")
    return;

  let dx=0;
  let dy=0;

  if(keys.left)
    dx--;

  if(keys.right)
    dx++;

  if(keys.up)
    dy--;

  if(keys.down)
    dy++;

  if(dx!==0 && dy!==0){

    dx*=0.7;
    dy*=0.7;

  }

  player.x+=dx*2;
  player.y+=dy*2;

  player.x=Math.max(
    12,
    Math.min(W-12,player.x)
  );

  player.y=Math.max(
    65,
    Math.min(H-12,player.y)
  );

  /* NPC abre loja */

  const npcDistance=Math.hypot(
    player.x-75,
    player.y-145
  );

  if(
    npcDistance<25 &&
    keys.up
  ){

    state="shop";
    keys.up=false;

  }

  /* inimigos */

  for(const e of enemies){

    if(e.hp<=0)
      continue;

    const distance=Math.hypot(
      player.x-e.x,
      player.y-e.y
    );

    if(distance<20){

      enemy=e;
      state="battle";
      message="";

      break;
    }

  }

}

/* =========================
   ATAQUE
========================= */

function attack(){

  /* COMEÇAR */

  if(state==="menu"){

    enterFullscreen();

    state="world";

    return;
  }

  /* BATALHA */

  if(state==="battle"){

    const damage=Math.max(
      1,
      player.attack-
      Math.floor(Math.random()*4)
    );

    enemy.hp-=damage;

    showMessage(
      "Você causou "+damage+" de dano!"
    );

    if(enemy.hp<=0){

      winBattle();

      return;
    }

    enemyAttack();

    return;
  }

  /* LOJA */

  if(state==="shop"){

    buyPotion();

  }

}

/* =========================
   ESPECIAL
========================= */

function specialAttack(){

  if(state!=="battle")
    return;

  if(player.mana<10){

    showMessage(
      "Mana insuficiente!"
    );

    return;
  }

  player.mana-=10;

  const damage=
    player.attack+12;

  enemy.hp-=damage;

  showMessage(
    "GOLPE ESPECIAL! "+damage
  );

  if(enemy.hp<=0){

    winBattle();

    return;
  }

  enemyAttack();

}

/* =========================
   POÇÃO
========================= */

function usePotion(){

  if(state!=="battle")
    return;

  if(player.potions<=0){

    showMessage(
      "Você não tem poções!"
    );

    return;
  }

  player.potions--;

  player.hp=Math.min(
    player.maxHp,
    player.hp+35
  );

  showMessage(
    "Você recuperou 35 HP!"
  );

  enemyAttack();

}

/* =========================
   VITÓRIA
========================= */

function winBattle(){

  player.xp+=enemy.xp;
  player.gold+=enemy.gold;

  /* missão */

  const mission=missions[missionIndex];

  let correct=false;

  if(
    mission.title==="Os Goblins" &&
    enemy.type==="Goblin"
  )
    correct=true;

  if(
    mission.title==="Lobos da Floresta" &&
    enemy.type==="Lobo"
  )
    correct=true;

  if(
    mission.title==="Bandidos" &&
    enemy.type==="Bandido"
  )
    correct=true;

  if(
    mission.title==="O Grande Orc" &&
    enemy.type==="Orc"
  )
    correct=true;

  if(correct){

    missionProgress++;

  }

  enemy.hp=0;

  checkLevel();

  checkMission();

  state="world";

  saveGame();

}

/* =========================
   ATAQUE DO INIMIGO
========================= */

function enemyAttack(){

  if(!enemy)
    return;

  const damage=Math.max(
    1,
    enemy.attack-
    player.defense+
    Math.floor(Math.random()*3)
  );

  player.hp-=damage;

  if(player.hp<=0){

    player.hp=player.maxHp;
    player.mana=player.maxMana;

    player.gold=Math.floor(
      player.gold/2
    );

    state="world";

    enemy=null;

    showMessage(
      "Você foi derrotado!"
    );

    saveGame();

  }

}

/* =========================
   LEVEL UP
========================= */

function checkLevel(){

  while(
    player.xp>=player.nextXP
  ){

    player.xp-=player.nextXP;

    player.level++;

    player.nextXP=
      Math.floor(
        player.nextXP*1.5
      );

    player.maxHp+=15;
    player.hp=player.maxHp;

    player.maxMana+=5;
    player.mana=player.maxMana;

    player.attack+=3;
    player.defense++;

    showMessage(
      "SUBIU DE NÍVEL!"
    );

  }

}

/* =========================
   MISSÃO
========================= */

function checkMission(){

  const m=missions[missionIndex];

  if(missionProgress>=m.target){

    player.xp+=m.xp;
    player.gold+=m.gold;

    missionProgress=0;

    if(
      missionIndex<
      missions.length-1
    ){

      missionIndex++;

      showMessage(
        "MISSÃO COMPLETA!"
      );

    }else{

      showMessage(
        "VOCÊ ZEROU AS MISSÕES!"
      );

    }

    checkLevel();

  }

}

/* =========================
   LOJA
========================= */

function buyPotion(){

  if(player.gold>=15){

    player.gold-=15;
    player.potions++;

    saveGame();

  }else{

    showMessage(
      "Ouro insuficiente!"
    );

  }

}

/* =========================
   MENSAGEM
========================= */

function showMessage(t){

  message=t;
  messageTimer=120;

}

/* =========================
   SAVE
========================= */

function saveGame(){

  const data={

    player:player,

    missionIndex:missionIndex,

    missionProgress:missionProgress,

    enemies:enemies

  };

  localStorage.setItem(
    "MedievalRPG_Save",
    JSON.stringify(data)
  );

}

/* =========================
   LOAD
========================= */

function loadGame(){

  try{

    const saved=
      localStorage.getItem(
        "MedievalRPG_Save"
      );

    if(!saved)
      return;

    const data=
      JSON.parse(saved);

    if(data.player)
      Object.assign(
        player,
        data.player
      );

    if(
      typeof data.missionIndex==="number"
    ){

      missionIndex=
        data.missionIndex;

    }

    if(
      typeof data.missionProgress==="number"
    ){

      missionProgress=
        data.missionProgress;

    }

    if(data.enemies){

      enemies=data.enemies;

    }

  }catch(error){

    console.log(
      "Save corrompido."
    );

  }

}

/* =========================
   CONTROLES TOUCH
========================= */

function holdButton(id,key){

  const button=
    document.getElementById(id);

  function down(e){

    e.preventDefault();

    keys[key]=true;

  }

  function up(e){

    e.preventDefault();

    keys[key]=false;

  }

  button.addEventListener(
    "pointerdown",
    down
  );

  button.addEventListener(
    "pointerup",
    up
  );

  button.addEventListener(
    "pointercancel",
    up
  );

  button.addEventListener(
    "pointerleave",
    up
  );

}

holdButton("up","up");
holdButton("down","down");
holdButton("left","left");
holdButton("right","right");

/* =========================
   BOTÃO A
========================= */

document
.getElementById("A")
.addEventListener(
  "pointerdown",
  async function(e){

    e.preventDefault();

    await enterFullscreen();

    attack();

  }
);

/* =========================
   BOTÃO B
========================= */

document
.getElementById("B")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    if(state==="battle"){

      usePotion();

    }

    else if(state==="inventory"){

      state="world";

    }

    else if(state==="shop"){

      state="world";

    }

  }
);

/* =========================
   INVENTÁRIO
========================= */

document
.getElementById("inventoryButton")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    if(state==="world"){

      state="inventory";

    }

  }
);

/* =========================
   TECLADO
========================= */

document.addEventListener(
  "keydown",
  async function(e){

    const k=e.key.toLowerCase();

    if(
      k==="w" ||
      e.key==="ArrowUp"
    )
      keys.up=true;

    if(
      k==="s" ||
      e.key==="ArrowDown"
    )
      keys.down=true;

    if(
      k==="a" ||
      e.key==="ArrowLeft"
    )
      keys.left=true;

    if(
      k==="d" ||
      e.key==="ArrowRight"
    )
      keys.right=true;

    if(e.key==="Enter"){

      await enterFullscreen();

      attack();

    }

    if(k==="i"){

      if(state==="world")
        state="inventory";

    }

    if(k==="l"){

      if(state==="world")
        state="shop";

    }

    if(e.key==="Escape"){

      state="world";

    }

    if(k==="2"){

      specialAttack();

    }

    if(k==="3"){

      usePotion();

    }

  }
);

document.addEventListener(
  "keyup",
  function(e){

    const k=e.key.toLowerCase();

    if(
      k==="w" ||
      e.key==="ArrowUp"
    )
      keys.up=false;

    if(
      k==="s" ||
      e.key==="ArrowDown"
    )
      keys.down=false;

    if(
      k==="a" ||
      e.key==="ArrowLeft"
    )
      keys.left=false;

    if(
      k==="d" ||
      e.key==="ArrowRight"
    )
      keys.right=false;

  }
);

/* =========================
   LOOP
========================= */

function gameLoop(){

  movePlayer();

  if(messageTimer>0)
    messageTimer--;

  if(state==="menu")
    drawMenu();

  else if(state==="world")
    drawWorld();

  else if(state==="battle")
    drawBattle();

  else if(state==="inventory")
    drawInventory();

  else if(state==="shop")
    drawShop();

  requestAnimationFrame(
    gameLoop
  );

}

/* =========================
   INICIAR
========================= */

loadGame();

gameLoop();

</script>
