<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MedievalRPG</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

canvas{
  width:100vw;
  height:100dvh;
  display:block;
  image-rendering:pixelated;
  background:#111;
}

#rotate{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#080808;
  color:#fff;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

#rotate div{
  font-size:70px;
  margin-bottom:20px;
}

@media(max-width:800px) and (orientation:portrait){
  #rotate{display:flex}
  #game,#controls{display:none}
}

#controls{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
}

#dpad{
  position:absolute;
  bottom:15px;
  left:15px;
  width:180px;
  height:150px;
  pointer-events:auto;
}

.pad{
  position:absolute;
  width:58px;
  height:48px;
  border:2px solid #aaa;
  border-radius:9px;
  background:rgba(20,20,20,.9);
  color:#fff;
  font-size:22px;
}

#up{left:61px;top:0}
#down{left:61px;bottom:0}
#left{left:0;top:51px}
#right{right:0;top:51px}

#actions{
  position:absolute;
  right:18px;
  bottom:18px;
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.action{
  width:68px;
  height:68px;
  border-radius:50%;
  border:3px solid #fff;
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

#a{
  background:#9d2929;
}

#b{
  background:#28589e;
}

#inventory{
  background:#704494;
}

#battleControls{
  display:none;
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(95vw,720px);
  gap:7px;
  pointer-events:auto;
}

.battleBtn{
  flex:1;
  min-height:58px;
  border:2px solid #fff;
  border-radius:10px;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  background:#333;
}

#attack1{
  background:#23733c;
}

#attack2{
  background:#8a5725;
}

#potion{
  background:#71388c;
}
</style>
</head>

function fullscreen(){

 try{

  if(document.documentElement.requestFullscreen){
   document.documentElement.requestFullscreen();
  }

 }catch(e){}

 try{

  if(screen.orientation &&
     screen.orientation.lock){

   screen.orientation.lock("landscape");

  }

 }catch(e){}

}


/* =========================
   DESENHO
========================= */

function rect(x,y,w,h,c){

 ctx.fillStyle=c;
 ctx.fillRect(x,y,w,h);

}

function text(t,x,y,size,c="#fff",align="left"){

 ctx.fillStyle=c;
 ctx.font="bold "+size+"px Arial";
 ctx.textAlign=align;
 ctx.fillText(t,x,y);

}

function bar(x,y,w,h,value,max,c){

 rect(x,y,w,h,"#161616");

 rect(
  x,
  y,
  w*Math.max(
   0,
   Math.min(
    1,
    value/max
   )
  ),
  h,
  c
 );

 ctx.strokeStyle="#fff";
 ctx.strokeRect(x,y,w,h);

}

/* =========================

function drawPlayer(x,y,type,scale=1){

 const c=classes[type];

 const s=scale;

 /* cabeça */

  x-13*s,
  y-42*s,
  26*s,
  25*s,
  "#efbd86"
 );

 /* cabelo/capacete */

 if(type==="warrior"){

  rect(
   x-15*s,
   y-47*s,
   30*s,
   10*s,
   "#777"
  );

 }

 if(type==="archer"){

  rect(
   x-14*s,
   y-47*s,
   28*s,
   9*s,
   "#56341e"
  );

 }

 if(type==="mage"){

  rect(
   x-17*s,
   y-50*s,
   34*s,
   13*s,
   "#36234c"
  );

 }

 /* corpo */

 rect(
  x-16*s,
  y-16*s,
  32*s,
  39*s,
  c.color
 );

 /* braços */

 rect(
  x-25*s,
  y-14*s,
  8*s,
  29*s,
  c.color
 );

 rect(
  x+17*s,
  y-14*s,
  8*s,
  29*s,
  c.color
 );

 /* pernas */

 rect(
  x-12*s,
  y+23*s,
  9*s,
  23*s,
  "#252525"
 );

 rect(
  x+3*s,
  y+23*s,
  9*s,
  23*s,
  "#252525"
 );


 /* espada */

 if(type==="warrior"){

  rect(
   x+23*s,
   y-30*s,
   5*s,
   48*s,
   "#ddd"
  );

  rect(
   x+15*s,
   y+8*s,
   22*s,
   5*s,
   "#70451f"
  );

 }


 /* arco */

 if(type==="archer"){

  ctx.strokeStyle="#c58b45";
  ctx.lineWidth=3*s;

  ctx.beginPath();

  ctx.arc(
   x+26*s,
   y+1*s,
   22*s,
   -1.2,
   1.2
  );

  ctx.stroke();

  rect(
   x+24*s,
   y,
   28*s,
   3*s,
   "#eee"
  );

 }


 /* cajado */

 if(type==="mage"){

  rect(
   x+22*s,
   y-42*s,
   5*s,
   60*s,
   "#75451f"
  );

  rect(
   x+17*s,
   y-48*s,
   15*s,
   12*s,
   "#ae5cff"
  );

 }

}

     Math.random()*
     cities[city].enemies.length

  enemies.push({

   name:base.name,

   hp:base.hp,

   maxHp:base.hp,

   attack:base.attack,

   gold:base.gold,

   xp:base.xp,

   x:80+
      Math.random()*800,

   y:250+
      Math.random()*170,

   alive:true

  });

 }

}

/* =========================
   ATAQUE 1
========================= */

function basicAttack(){

 if(state!=="battle")
  return;


 let damage=
  player.attack;


 if(player.class==="warrior"){

  damage=
   player.attack+3;

 }


 if(player.class==="archer"){

  if(player.arrows<=0){

   showMessage(
    "SEM FLECHAS!"
   );

   return;

  }

  player.arrows--;

  damage=
   player.attack+7;

 }


 if(player.class==="mage"){

  damage=
   player.attack+5;

 }


 battleEnemy.hp-=damage;


 showMessage(
  "Você causou "+
  damage+
  " de dano!"
 );


 if(battleEnemy.hp<=0){

  victory();

  return;

 }


 setTimeout(
  enemyAttack,
  500
 );

}


/* =========================
   ATAQUE 2
========================= */

function specialAttack(){

 if(state!=="battle")
  return;


 let damage=0;


 /* GUERREIRO */

 if(player.class==="warrior"){

  if(player.mana<10){

   showMessage(
    "MANA INSUFICIENTE!"
   );

   return;

  }

  player.mana-=10;

  damage=
   player.attack+25;

 }


 /* ARQUEIRO */

 if(player.class==="archer"){

  if(player.arrows<2){

   showMessage(
    "PRECISA DE 2 FLECHAS!"
   );

   return;

  }

  if(player.mana<10){

   showMessage(
    "MANA INSUFICIENTE!"
   );

   return;

  }

  player.arrows-=2;

  player.mana-=10;

  damage=
   player.attack+35;

 }


 /* MAGO */

 if(player.class==="mage"){

  if(player.mana<25){

   showMessage(
    "MANA INSUFICIENTE!"
   );

   return;

  }

  player.mana-=25;

  damage=
   player.attack+55;

 }


 battleEnemy.hp-=damage;


 showMessage(
  "ATAQUE ESPECIAL! "+
  damage+
  " DE DANO!"
 );


 if(battleEnemy.hp<=0){

  victory();

  return;

 }


 setTimeout(
  enemyAttack,
  500
 );

}


/* =========================
   POÇÃO
========================= */

function usePotion(){

 if(state!=="battle")
  return;


 if(player.potions<=0){

  showMessage(
   "SEM POÇÕES!"
  );

  return;

 }


 if(player.hp>=player.maxHp){

  showMessage(
   "HP JÁ ESTÁ CHEIO!"
  );

  return;

 }


 player.potions--;


 const heal=50;


 player.hp=
  Math.min(
   player.maxHp,
   player.hp+heal
  );


 showMessage(
  "RECUPEROU "+heal+" HP!"
 );


 setTimeout(
  enemyAttack,
  500
 );

}


/* =========================
   ENEMY ATTACK
========================= */

function enemyAttack(){

 if(state!=="battle")
  return;


 const damage=
  Math.max(
   1,
   battleEnemy.attack-
   player.defense
  );


 player.hp-=damage;


 showMessage(
  battleEnemy.name+
  " causou "+
  damage+
  " de dano!"
 );


 if(player.hp<=0){

  player.hp=
   player.maxHp;

  player.mana=
   player.maxMana;

  player.gold=
   Math.max(
    0,
    player.gold-25
   );

  state="world";

  battleEnemy=null;

  showMessage(
   "VOCÊ FOI DERROTADO!"
  );

 }


 saveGame();

}


/* =========================
   VITÓRIA
========================= */

function victory(){

 const e=
  battleEnemy;


 player.gold+=
  e.gold;

 player.xp+=
  e.xp;


 updateMission(
  e.name
 );


 levelUp();


 showMessage(
  "VITÓRIA! +"+
  e.gold+
  " OURO  +"+
  e.xp+
  " XP"
 );


 state="world";

 battleEnemy=null;

 createEnemies();

 saveGame();

}


/* =========================
   MISSÃO PROGRESS
========================= */

function updateMission(name){

 const m=
  missions[player.mission];


 if(!m)
  return;


 if(name!==m.target)
  return;


 player.missionKills++;


 if(
  player.missionKills>=
  m.need
 ){

  player.gold+=
   m.reward;

  player.mission++;

  player.missionKills=0;

  showMessage(
   "MISSÃO COMPLETA! +"+
   m.reward+
   " OURO"
  );

 }

}


/* =========================
   LEVEL UP
========================= */

function levelUp(){

 while(
  player.xp>=
  player.nextXp
 ){

  player.xp-=
   player.nextXp;

  player.level++;

  player.nextXp=
   Math.floor(
    player.nextXp*1.5
   );

  player.maxHp+=20;

  player.hp=
   player.maxHp;

  player.maxMana+=12;

  player.mana=
   player.maxMana;

  player.attack+=4;

  player.defense+=1;


  showMessage(
   "LEVEL UP! NÍVEL "+
   player.level
  );

 }

}


/* =========================
   MESSAGE
========================= */

function showMessage(t){

 message=t;

 messageTime=150;

}


/* =========================
   INTERACT
========================= */

function interact(){

 if(state!=="world")
  return;


 /* inimigo */

 for(const e of enemies){

  if(
   e.alive &&
   Math.abs(
    e.x-player.x
   )<55 &&
   Math.abs(
    e.y-player.y
   )<65
  ){

   e.alive=false;

   battleEnemy={
    ...e,
    hp:e.maxHp
   };

   state="battle";

   updateBattleButtons();

   return;

  }

 }


 /* mestre */

 if(
  Math.abs(
   player.x-190
  )<70 &&
  Math.abs(
   player.y-285
  )<75
 ){

  state="mission";

  return;

 }


 /* portal */

 if(player.x>800){

  city=
   (city+1)%
   cities.length;

  player.x=100;

  createEnemies();

  showMessage(
   "CHEGOU EM "+
   cities[city].name
  );

 }

}


/* =========================
   CHOOSE CLASS
========================= */

function chooseClass(type){

 const c=
  classes[type];


 player.class=
  type;

 player.maxHp=
  c.hp;

 player.hp=
  c.hp;

 player.maxMana=
  c.mana;

 player.mana=
  c.mana;

 player.attack=
  c.attack;

 player.defense=
  c.defense;


 if(type==="archer"){

  player.arrows=
   Math.max(
    player.arrows,
    30
   );

 }


 player.x=180;
 player.y=350;


 createEnemies();


 state="world";


 saveGame();

}


/* =========================
   MOVEMENT
========================= */

function move(dx,dy){

 if(state!=="world")
  return;


 player.x+=dx;
 player.y+=dy;


 player.x=
  Math.max(
   30,
   Math.min(
    920,
    player.x
   )
  );


 player.y=
  Math.max(
   235,
   Math.min(
    460,
    player.y
   )
  );

}


/* =========================
   UPDATE
========================= */

function update(){

 if(messageTime>0)
  messageTime--;


 if(state==="world"){

  if(keys.up)
   move(0,-3);

  if(keys.down)
   move(0,3);

  if(keys.left)
   move(-3,0);

  if(keys.right)
   move(3,0);

 }

}


/* =========================
   DRAW
========================= */

function draw(){

 if(state==="menu")
  drawMenu();

 if(state==="class")
  drawClass();

 if(state==="world")
  drawWorld();

 if(state==="mission")
  drawMission();

 if(state==="inventory")
  drawInventory();

 if(state==="battle")
  drawBattle();


 updateBattleButtons();


 if(messageTime>0){

  rect(
   220,
   80,
   520,
   55,
   "rgba(0,0,0,.9)"
  );

  text(
   message,
   W/2,
   115,
   18,
   "#fff",
   "center"
  );

 }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
 "keydown",
 e=>{

  if(
   e.key==="ArrowUp"||
   e.key==="w"||
   e.key==="W"
  )
   keys.up=true;


  if(
   e.key==="ArrowDown"||
   e.key==="s"||
   e.key==="S"
  )
   keys.down=true;


  if(
   e.key==="ArrowLeft"||
   e.key==="a"||
   e.key==="A"
  )
   keys.left=true;


  if(
   e.key==="ArrowRight"||
   e.key==="d"||
   e.key==="D"
  )
   keys.right=true;


  if(e.key==="Enter"){

   fullscreen();


   if(state==="menu"){

    state="class";

   }
   else if(state==="world"){

    interact();

   }
   else if(state==="mission"){

    state="world";

   }

  }


  /* classes */

  if(state==="class"){

   if(e.key==="1")
    chooseClass("warrior");

   if(e.key==="2")
    chooseClass("archer");

   if(e.key==="3")
    chooseClass("mage");

  }


  /* battle */

  if(state==="battle"){

   if(e.key==="1")
    basicAttack();

   if(e.key==="2")
    specialAttack();

   if(e.key==="3")
    usePotion();

  }


  /* inventory */

  if(
   e.key==="i"||
   e.key==="I"
  ){

   if(state==="world")
    state="inventory";

   else if(state==="inventory")
    state="world";

  }


  if(e.key==="Escape"){

   if(
    state==="battle"||
    state==="mission"||
    state==="inventory"
   ){

    state="world";

   }
   else if(state==="class"){

    state="menu";

   }

  }

 });


document.addEventListener(
 "keyup",
 e=>{

  if(
   e.key==="ArrowUp"||
   e.key==="w"||
   e.key==="W"
  )
   keys.up=false;


  if(
   e.key==="ArrowDown"||
   e.key==="s"||
   e.key==="S"
  )
   keys.down=false;


  if(
   e.key==="ArrowLeft"||
   e.key==="a"||
   e.key==="A"
  )
   keys.left=false;


  if(
   e.key==="ArrowRight"||
   e.key==="d"||
   e.key==="D"
  )
   keys.right=false;

 });

/* =========================
   D-PAD
========================= */

function direction(id,key){

 const b=
  document.getElementById(id);


 b.addEventListener(
  "pointerdown",
 e=>{

   e.preventDefault();

   keys[key]=true;

  });


 b.addEventListener(
  "pointerup",
 e=>{

   e.preventDefault();

   keys[key]=false;

  });


 b.addEventListener(
  "pointercancel",
 ()=>{
  keys[key]=false;
 });


 b.addEventListener(
  "pointerleave",
 ()=>{
  keys[key]=false;
 });

}

direction("up","up");
direction("down","down");
direction("left","left");
direction("right","right");


/* =========================
   INIMIGOS MOVENDO
========================= */

setInterval(
 ()=>{

  if(state!=="world")
   return;


  for(const e of enemies){

   if(!e.alive)
    continue;


   const dx=
    player.x-e.x;

   const dy=
    player.y-e.y;

   const dist=
    Math.sqrt(
     dx*dx+
     dy*dy
    );


   if(
    dist<150 &&
    dist>60
   ){

    e.x+=
     dx/dist*.35;

    e.y+=
     dy/dist*.35;

   }

  }

 },
 30
);


/* =========================
   LOOP
========================= */

function loop(){

 update();

 draw();

 requestAnimationFrame(
  loop
 );

}


loadGame();

createEnemies();

loop();
