<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MedievalRPG</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  font-family:monospace;
}

#gameContainer{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  width:100dvw;
  height:100dvh;
  background:#000;
  overflow:hidden;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  image-rendering:pixelated;
}

#rotate{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#111;
  color:white;
  text-align:center;
}

#rotate div{
  font-size:60px;
}

#rotate h1{
  color:#e5c36a;
  margin-top:10px;
  font-size:20px;
}

#rotate p{
  color:#aaa;
  margin-top:8px;
}

/* CONTROLES */

#controls{
  position:fixed;
  inset:0;
  pointer-events:none;
}

#dpad{
  position:absolute;
  left:3%;
  bottom:5%;
  width:150px;
  height:150px;
}

.pad{
  position:absolute;
  width:52px;
  height:52px;
  border:3px solid #888;
  border-radius:9px;
  background:linear-gradient(#555,#222);
  color:#fff;
  font-size:26px;
  font-weight:bold;
  box-shadow:0 5px 0 #111;
  pointer-events:auto;
  touch-action:none;
}

.pad:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #111;
}

#up{left:49px;top:0}
#down{left:49px;bottom:0}
#left{left:0;top:49px}
#right{right:0;top:49px}

#buttons{
  position:absolute;
  right:4%;
  bottom:5%;
  width:170px;
  height:145px;
}

.action{
  position:absolute;
  width:72px;
  height:72px;
  border-radius:50%;
  border:4px solid #888;
  background:linear-gradient(#555,#222);
  color:white;
  font-size:28px;
  font-weight:bold;
  box-shadow:0 6px 0 #111;
  pointer-events:auto;
  touch-action:none;
}

.action:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #111;
}

#A{right:0;top:0}
#B{left:0;bottom:0}

#inv{
  position:absolute;
  top:4%;
  right:4%;
  width:48px;
  height:42px;
  border:3px solid #777;
  border-radius:8px;
  background:#222;
  color:#fff;
  font-weight:bold;
  pointer-events:auto;
  touch-action:none;
}

@media(orientation:portrait){
  #gameContainer,
  #controls{
    display:none;
  }

  #rotate{
    display:flex;
  }
}
</style>
</head>

<body>

<div id="rotate">
  <div>📱</div>
  <h1>VIRE O CELULAR DE LADO</h1>
  <p>MedievalRPG foi feito para jogar na horizontal.</p>
</div>

<div id="gameContainer">

<canvas id="game" width="640" height="360"></canvas>

<div id="controls">

  <div id="dpad">
    <button class="pad" id="up">▲</button>
    <button class="pad" id="down">▼</button>
    <button class="pad" id="left">◀</button>
    <button class="pad" id="right">▶</button>
  </div>

  <div id="buttons">
    <button class="action" id="A">A</button>
    <button class="action" id="B">B</button>
  </div>

  <button id="inv">I</button>

</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=640;
const H=360;

/* =========================
   ESTADO
========================= */

let state="menu";
let city=0;
let enemy=null;
let message="";
let messageTime=0;
let interaction=null;

const keys={
  up:false,
  down:false,
  left:false,
  right:false
};

/* =========================
   PLAYER
========================= */

const player={

  y:190,

  class:"",

  hp:100,
  maxHp:100,

  mana:40,
  maxMana:40,

  attack:12,
  defense:4,

  level:1,
  xp:0,
  nextXP:50,

  gold:50,
  potions:3,
  arrows:20,

  kills:0

/* =========================
   CLASSES
========================= */

const classes={
  warrior:{
    name:"Guerreiro",
    icon:"⚔️",
    hp:130,
    mana:25,
    attack:16,
    defense:8
  },

  archer:{
    name:"Arqueiro",
    icon:"🏹",
    hp:100,
    mana:35,
    attack:20,
    defense:4
  },

  mage:{
    name:"Mago",
    icon:"🧙",
    hp:80,
    mana:100,
    attack:11,
    defense:2
  }
};

/* =========================
   CIDADES
========================= */

const cities=[
  {
    name:"Vila de Pedra",
    color:"#4d8a43"
  },

  {
    name:"Cidade Real",
    color:"#5b78a8"
  },

  {
    name:"Cidade Sombria",
    color:"#503e63"
  }

/* =========================
   MISSÕES
========================= */

const missions=[
  {
    city:0,
    title:"Ameaça dos Goblins",
    text:"Derrote 3 Goblins.",
    enemy:"Goblin",
    amount:3,
    progress:0,
    xp:60,
    gold:40
  },

  {
    city:0,
    title:"Lobos da Floresta",
    text:"Derrote 4 Lobos.",
    enemy:"Lobo",
    amount:4,
    progress:0,
    xp:80,
    gold:50
  },

  {
    city:1,
    title:"Bandidos da Estrada",
    text:"Derrote 5 Bandidos.",
    enemy:"Bandido",
    amount:5,
    progress:0,
    xp:120,
    gold:90
  },

    city:1,
    title:"O Orc",
    text:"Derrote o Orc.",
    enemy:"Orc",
    amount:1,
    progress:0,
    xp:180,
    gold:130
  },

  {
    city:2,
    title:"Criaturas Sombrias",
    text:"Derrote 5 criaturas.",

    amount:5,
    progress:0,

    gold:200
  },

  {

    title:"O Senhor Sombrio",

    enemy:"Senhor Sombrio",
    amount:1,
    progress:0,
    xp:500,
    gold:500

];

let currentMission=0;

/* =========================
   INIMIGOS
========================= */

let enemies=[];

function makeEnemies(){

  enemies=[];

  if(city===0){

    enemies=[
      enemyObj("Goblin",100,100,40,8,15,8),
      enemyObj("Goblin",180,260,40,8,15,8),
      enemyObj("Goblin",400,100,40,8,15,8),
      enemyObj("Lobo",510,250,35,10,18,10),
      enemyObj("Lobo",290,280,35,10,18,10)
    ];

  }

  if(city===1){

    enemies=[
      enemyObj("Bandido",120,100,60,12,25,15),
      enemyObj("Bandido",200,270,60,12,25,15),
      enemyObj("Bandido",430,100,60,12,25,15),
      enemyObj("Bandido",520,270,60,12,25,15),
      enemyObj("Orc",470,190,100,17,40,30)
    ];

  }

  if(city===2){

    enemies=[
      enemyObj("Sombra",100,90,70,15,35,25),
      enemyObj("Sombra",200,280,70,15,35,25),
      enemyObj("Sombra",430,90,70,15,35,25),
      enemyObj("Sombra",520,270,70,15,35,25),
      enemyObj("Senhor Sombrio",430,190,180,25,100,100)
    ];

  }
}

function enemyObj(
  type,
  x,
  y,
  hp,
  attack,
  xp,
  gold
){

  let color="#4c9348";

  if(type==="Lobo")
    color="#777";

  if(type==="Bandido")
    color="#75462c";

  if(type==="Orc")
    color="#315d36";

  if(type==="Sombra")
    color="#542d70";

  if(type==="Senhor Sombrio")
    color="#17101f";

  return{
    type,
    x,
    y,
    hp,
    maxHp:hp,
    attack,
    xp,
    gold,
    color
  };
}

makeEnemies();

/* =========================
   FUNÇÕES
========================= */

function rect(x,y,w,h,c){

  ctx.fillStyle=c;
  ctx.fillRect(
    Math.floor(x),
    Math.floor(y),
    w,
    h
  );

}

function txt(t,x,y,size=10,c="#fff"){

  ctx.fillStyle=c;
  ctx.font=size+"px monospace";

  ctx.fillText(
    t,
    Math.floor(x),
    Math.floor(y)
  );
}

function bar(x,y,w,h,v,m,c){

  rect(x,y,w,h,"#111");

  rect(
    x,
    y,
    Math.max(0,w*(v/m)),
    h,
    c
  );

  ctx.strokeStyle="#000";
  ctx.strokeRect(x,y,w,h);
}

/* =========================
   FULLSCREEN
========================= */

async function fullscreen(){

  try{

    if(!document.fullscreenElement){

      if(document.documentElement.requestFullscreen){

        await document.documentElement.requestFullscreen();

      }else if(
        document.documentElement.webkitRequestFullscreen
      ){

        document.documentElement.webkitRequestFullscreen();

      }

    }

  }catch(e){}

  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation.lock("landscape");

    }

  }catch(e){}

}

/* =========================
   MENU
========================= */

function drawMenu(){

  rect(0,0,W,H,"#101522");

  txt(

    185,

    32,
    "#e5c36a"
  );

    215,
    92,

  );

  /* castelo */

  rect(90,135,460,150,"#303030");

  rect(110,100,70,185,"#444");
  rect(460,100,70,185,"#444");

  rect(250,185,140,100,"#242424");

  rect(285,225,70,60,"#111");

  /* botão */

  rect(
    235,
    305,
    170,
    38,
    "#684b25"
  );

  txt(
    "A  COMEÇAR",
    270,
    330,
    12

/* =========================
   ESCOLHA DE CLASSE
========================= */

function drawClasses(){

  rect(0,0,W,H,"#121212");

  txt(
    "ESCOLHA SEU HERÓI",
    220,
    45,
    18,
    "#e5c36a"
  );

  classCard(
    55,
    "1",
    "⚔",
    "GUERREIRO",
    "Muito HP e defesa"
  );

  classCard(
    235,
    "2",
    "🏹",
    "ARQUEIRO",
    "Ataque rápido"
  );

  classCard(
    415,
    "3",
    "✦",
    "MAGO",
    "Muito mana e magia"
  );

}

function classCard(
  x,
  key,
  icon,
  name,
  desc
){

  rect(
    x,
    80,
    170,
    205,
    "#252525"
  );

  ctx.strokeStyle="#765c30";
  ctx.strokeRect(
    x,
    80,
    170,
    205
  );

  txt(
    key,
    x+10,
    105,
    12,
    "#e5c36a"
  );

  txt(
    icon,
    x+63,
    155,
    40
  );

  txt(
    name,
    x+35,
    195,
    12,
    "#fff"
  );

  txt(
    desc,
    x+20,
    220,
    8,
    "#aaa"
  );

}

/* =========================
   MUNDO
========================= */

function drawWorld(){

  rect(
    0,
    0,
    W,
    H,
    cities[city].color
  );

  /* estrada */

  rect(
    0,
    155,
    W,
    45,
    "#a88b60"
  );

  rect(
    295,
    0,
    50,
    H,
    "#a88b60"
  );

  /* rio */

  if(city===0){

    rect(
      0,
      0,
      640,
      35,
      "#286b91"
    );

  }

  if(city===1){

    rect(
      0,
      0,
      640,
      35,
      "#337fa2"
    );

  }

  if(city===2){

    rect(
      0,
      0,
      640,
      35,
      "#25253f"
    );

  }

  /* casas */

  drawHouses();

  /* mestre */

  drawMaster();

  /* portal */

  drawCityGate();

  /* inimigos */

  for(const e of enemies){

    if(e.hp>0)
      drawEnemy(e);

  }

  /* jogador */

  drawPlayer(
    player.x,
    player.y
  );

  /* HUD */

  drawHUD();

}

/* =========================
   CASAS
========================= */

function drawHouses(){

  const houses=[
    [30,70],
    [400,55],
    [500,220]
  ];

  for(const h of houses){

    rect(
      h[0],
      h[1],
      80,
      55,
      city===2 ? "#4a394a" : "#8c5430"
    );

    rect(
      h[0]-5,
      h[1]-10,
      90,
      15,
      city===2 ? "#29212c" : "#63381f"
    );

    rect(
      h[0]+30,
      h[1]+25,
      18,
      30,
      "#39261d"
    );

  }

}

/* =========================
   MESTRE
========================= */

function drawMaster(){

  const x=150;
  const y=150;

  /* corpo */

  rect(
    x-10,
    y-5,
    20,
    28,
    "#4a2874"
  );

  /* cabeça */

  rect(
    x-8,
    y-20,
    16,
    15,
    "#c98d62"
  );

  /* chapéu */

  rect(
    x-14,
    y-27,
    28,
    7,
    "#252525"
  );

  rect(
    x-8,
    y-35,
    16,
    10,
    "#33204b"
  );

  txt(
    "MESTRE",
    x-24,
    y-43,
    7,
    "#fff"
  );

  /* missão disponível */

  const m=missions[currentMission];

  if(
    m &&
    m.city===city &&
    m.progress<m.amount
  ){

    txt(
      "!",
      x-3,
      y-47,

    );

}

/* =========================
   PORTAL
========================= */

function drawCityGate(){

  const x=560;
  const y=120;

  rect(
    x-25,
    y-35,
    50,
    70,
    "#3b3027"
  );

  rect(
    x-15,
    y-25,
    30,
    60,
    "#15131a"
  );

  txt(
    city===2 ? "VILA" : "CIDADE",
    x-25,
    y+52,
    7,
    "#fff"
  );

}

/* =========================
   PLAYER
========================= */

function drawPlayer(x,y){

  /* sombra */

  rect(
    x-11,
    y+13,
    22,
    4,
    "#245126"
  );

  /* pernas */

  rect(
    x-7,
    y+2,
    5,
    13,
    "#302d35"
  );

  rect(
    x+2,
    y+2,
    5,
    13,
    "#302d35"
  );

  /* corpo */

  let armor="#777";

  if(player.class==="mage")
    armor="#513d8a";

  if(player.class==="archer")
    armor="#386b3c";

  if(player.class==="warrior")
    armor="#555";

  rect(
    x-9,
    y-10,
    18,
    15,
    armor
  );

  /* cabeça */

  rect(
    x-7,
    y-22,
    14,
    12,
    "#c68d62"
  );

  /* cabelo */

  rect(
    x-8,
    y-25,
    16,
    6,
    "#30251d"
  );

  /* olho */

  rect(
    x+2,
    y-18,
    2,
    2,
    "#111"
  );

  /* arma */

  if(player.class==="warrior"){

    rect(
      x+10,
      y-8,
      3,
      25,
      "#ccc"
    );

    rect(
      x+7,
      y-3,
      10,
      3,
      "#754923"
    );

  }

  if(player.class==="archer"){

    ctx.strokeStyle="#6b4326";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(
      x+12,
      y-3,
      10,
      -1.2,
      1.2
    );
    ctx.stroke();

  }

  if(player.class==="mage"){

    rect(
      x+10,
      y-22,
      3,
      35,
      "#71452d"
    );

    rect(
      x+6,
      y-27,
      11,
      8,
      "#4ea4d8"
    );

  }

}

/* =========================
   INIMIGO
========================= */

function drawEnemy(e){

  const x=e.x;
  const y=e.y;

  rect(
    x-12,
    y+10,
    24,
    4,
    "#245126"
  );

  rect(
    x-10,
    y-5,
    20,
    18,
    e.color
  );

  rect(
    x-11,
    y-20,
    22,
    16,
    e.color
  );

  rect(
    x-12,
    y-25,
    6,
    8,
    e.color
  );

  rect(
    x+6,
    y-25,
    6,
    8,
    e.color
  );

  rect(
    x-6,
    y-14,
    3,
    3,
    "#fff"
  );

  rect(
    x+3,
    y-14,
    3,
    3,
    "#fff"
  );

  bar(
    x-20,
    y-35,
    40,
    4,
    e.hp,
    e.maxHp,
    "#d33"
  );

  txt(
    e.type,
    x-25,
    y-40,
    6
  );

}

/* =========================

========================= */

  txt(

  if(m && m.city===city){

    txt(

    txt(
      m.progress+"/"+m.amount,

      62,

    );

}

/* =========================
   MISSÃO
========================= */

function drawMission(){

  drawWorld();

  rect(
    100,
    70,
    440,
    220,
    "#161616"
  );

  ctx.strokeStyle="#e5c36a";

  ctx.strokeRect(
    100,
    70,
    440,
    220
  );

  const m=missions[currentMission];

  txt(
    "MISSÃO",
    270,
    100,
    20,
    "#e5c36a"
  );

  txt(
    m.title,
    150,
    140,
    14,
    "#fff"
  );

  txt(

/* =========================
   MOVIMENTO
========================= */

function move(){

  if(state!=="world")
    return;

  let dx=0;
  let dy=0;

  if(keys.left)dx--;
  if(keys.right)dx++;
  if(keys.up)dy--;
  if(keys.down)dy++;

  if(dx && dy){
    dx*=0.7;
    dy*=0.7;
  }

  player.x+=dx*2.5;
  player.y+=dy*2.5;

  player.x=Math.max(
    15,
    Math.min(
      W-15,
      player.x
    )
  );

  player.y=Math.max(
    50,
    Math.min(
      H-15,
      player.y
    )
  );

  /* MESTRE */

  const md=Math.hypot(
    player.x-150,
    player.y-150
  );

  if(
    md<30 &&
    (keys.up || keys.down)
  ){

    state="mission";

    keys.up=false;
    keys.down=false;

  }

  /* PORTAL */

  if(
    player.x>535 &&
    player.y>90 &&
    player.y<180
  ){

    if(city<2){

      city++;

    }else{

      city=0;

    }

    player.x=100;
    player.y=180;

    makeEnemies();

    show(
      "Você chegou em "+cities[city].name
    );

  }

  /* inimigos */

  for(const e of enemies){

    if(e.hp<=0)
      continue;

    const d=Math.hypot(
      player.x-e.x,
      player.y-e.y
    );

    if(d<25){

      enemy=e;
      state="battle";

      break;

    }

  }

}

/* =========================
   ATAQUE
========================= */

function attack(){

  if(state==="menu"){

    fullscreen();

    state="class";

    return;
  }

  if(state==="class"){

    return;
  }

  if(state==="mission"){

    acceptMission();

    return;
  }

  if(state==="battle"){

    let damage=player.attack;

    if(player.class==="archer"){

      if(player.arrows<=0){

        show("Sem flechas!");

        return;
      }

      player.arrows--;
      damage+=5;

    }

    enemy.hp-=damage;

    show(
      "Você causou "+damage+" de dano!"
    );

    if(enemy.hp<=0){

      victory();

      return;
    }

    enemyTurn();

  }

}

/* =========================
   ESPECIAL
========================= */

function special(){

  if(state!=="battle")
    return;

  let cost=15;

  if(player.mana<cost){

    show("Mana insuficiente!");

    return;
  }

  player.mana-=cost;

  let damage=0;

  if(player.class==="warrior"){

    damage=player.attack+15;

  }else if(player.class==="archer"){

    if(player.arrows<=0){

      show("Sem flechas!");

      return;
    }

    player.arrows--;

    damage=player.attack+20;

  }else{

    damage=player.attack+30;

  }

  enemy.hp-=damage;

  show(
    "ESPECIAL! "+damage+" de dano!"
  );

  if(enemy.hp<=0){

    victory();

    return;
  }

  enemyTurn();

}

/* =========================
   POÇÃO
========================= */

function potion(){

  if(state!=="battle")
    return;

  if(player.potions<=0){

    show("Sem poções!");

    return;
  }

  player.potions--;

  player.hp=Math.min(
    player.maxHp,
    player.hp+40
  );

  show(
    "Você recuperou 40 HP."
  );

  enemyTurn();

}

/* =========================
   INIMIGO ATACA
========================= */

function enemyTurn(){

  const damage=Math.max(
    1,
    enemy.attack-player.defense+
    Math.floor(Math.random()*4)
  );

  player.hp-=damage;

  if(player.hp<=0){

    player.hp=player.maxHp;
    player.mana=player.maxMana;

    player.gold=Math.floor(
      player.gold/2
    );

    state="world";

    player.x=320;
    player.y=190;

    show(
      "Você foi derrotado!"
    );

  }

}

/* =========================
   VITÓRIA
========================= */

function victory(){

  player.xp+=enemy.xp;
  player.gold+=enemy.gold;
  player.kills++;

  /* missão */

  const m=missions[currentMission];

  if(
    m &&
    m.city===city &&
    m.enemy===enemy.type
  ){

    m.progress++;

  }

  enemy.hp=0;

  levelUp();

  completeMission();

  state="world";

  save();

  show(
    "Vitória! +"+enemy.xp+
    " XP e +"+enemy.gold+" ouro"
  );

}

/* =========================
   LEVEL
========================= */

function levelUp(){

  while(
    player.xp>=player.nextXP
  ){

    player.xp-=player.nextXP;

    player.level++;

    player.nextXP=
      Math.floor(
        player.nextXP*1.5
      );

    player.maxHp+=20;
    player.hp=player.maxHp;

    player.maxMana+=10;
    player.mana=player.maxMana;

    player.attack+=4;
    player.defense+=2;

  }

}

/* =========================
   MISSÃO
========================= */

function acceptMission(){

  const m=missions[currentMission];

  if(!m){

    state="world";
    return;

  }

  if(
    m.city!==city
  ){

    state="world";
    return;

  }

  state="world";

  show(
    "Missão aceita: "+m.title
  );

}

/* =========================
   COMPLETAR MISSÃO
========================= */

function completeMission(){

  const m=missions[currentMission];

  if(!m)
    return;

  if(
    m.progress>=m.amount
  ){

    player.xp+=m.xp;
    player.gold+=m.gold;

    m.progress=0;

    if(
      currentMission<
      missions.length-1
    ){

      currentMission++;

      show(
        "MISSÃO COMPLETA!"
      );

    }else{

      show(
        "VOCÊ COMPLETOU TODAS AS MISSÕES!"
      );

    }

    levelUp();

  }

}

/* =========================
   MENSAGEM
========================= */

function show(t){

  message=t;
  messageTime=130;

}

/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "MedievalRPG_Save",
    JSON.stringify({
      player,
      city,
      currentMission,
      missions
    })
  );

}

/* =========================
   LOAD
========================= */

function load(){

  try{

    const s=
      localStorage.getItem(
        "MedievalRPG_Save"
      );

    if(!s)
      return;

    const d=JSON.parse(s);

    if(d.player)
      Object.assign(
        player,
        d.player
      );

    if(typeof d.city==="number")
      city=d.city;

    if(typeof d.currentMission==="number")
      currentMission=d.currentMission;

    if(d.missions){

      for(
        let i=0;
        i<missions.length;
        i++
      ){

        if(d.missions[i])
          missions[i].progress=
            d.missions[i].progress||0;

      }

    }

    if(player.class)
      state="world";
    else
      state="class";

    makeEnemies();

  }catch(e){

    console.log(e);

  }

}

/* =========================
   ESCOLHA DE CLASSE
========================= */

function chooseClass(c){

  player.class=c;

  const data=classes[c];

  player.maxHp=data.hp;
  player.hp=data.hp;

  player.maxMana=data.mana;
  player.mana=data.mana;

  player.attack=data.attack;
  player.defense=data.defense;

  state="world";

  save();

}

/* =========================
   TECLADO
========================= */

document.addEventListener(
  "keydown",
  async e=>{

    const k=e.key.toLowerCase();

    if(k==="w"||e.key==="ArrowUp")
      keys.up=true;

    if(k==="s"||e.key==="ArrowDown")
      keys.down=true;

    if(k==="a"||e.key==="ArrowLeft")
      keys.left=true;

    if(k==="d"||e.key==="ArrowRight")
      keys.right=true;

    if(e.key==="Enter"){

      await fullscreen();

      attack();

    }

    if(e.key==="1"){

      if(state==="class")
        chooseClass("warrior");

      else
        attack();

    }

    if(e.key==="2"){

      if(state==="class")
        chooseClass("archer");

      else
        special();

    }

    if(e.key==="3"){

      if(state==="class")
        chooseClass("mage");

    }

    if(e.key==="Escape"){

      state="world";

    }

    if(k==="i"){

      if(state==="world")
        state="inventory";

    }

  }
);

document.addEventListener(
  "keyup",
  e=>{

    const k=e.key.toLowerCase();

    if(k==="w"||e.key==="ArrowUp")
      keys.up=false;

    if(k==="s"||e.key==="ArrowDown")
      keys.down=false;

    if(k==="a"||e.key==="ArrowLeft")
      keys.left=false;

    if(k==="d"||e.key==="ArrowRight")
      keys.right=false;

  }
);

/* =========================
   CONTROLES TOUCH
========================= */

function hold(id,key){

  const b=document.getElementById(id);

  b.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );

  b.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );

  b.addEventListener(
    "pointercancel",
    e=>{
      keys[key]=false;
    }
  );

  b.addEventListener(
    "pointerleave",
    e=>{
      keys[key]=false;
    }
  );

}

hold("up","up");
hold("down","down");
hold("left","left");
hold("right","right");

/* =========================
   BOTÃO A
========================= */

document
.getElementById("A")
.addEventListener(
  "pointerdown",
  async e=>{

    e.preventDefault();

    await fullscreen();

    attack();

  }
);

/* =========================
   BOTÃO B
========================= */

document
.getElementById("B")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(state==="battle"){

      potion();

    }else{

      state="world";

    }

  }
);

/* =========================
   INVENTÁRIO
========================= */

document
.getElementById("inv")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(state==="world")
      state="inventory";

  }
);

/* =========================
   LOOP
========================= */

function loop(){

  move();

  if(messageTime>0)
    messageTime--;

  if(state==="menu")
    drawMenu();

  else if(state==="class")
    drawClasses();

  else if(state==="world")
    drawWorld();

  else if(state==="mission")
    drawMission();

  else if(state==="battle")
    drawBattle();

  else if(state==="inventory")
    drawInventory();

  requestAnimationFrame(loop);

}

load();

loop();

</script>
