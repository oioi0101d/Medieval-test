<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MedievalRPG</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#gameWrap{
  position:relative;
  width:min(100vw,900px);
  aspect-ratio:3/2;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  background:#222;
}

/* CONTROLES DE EMULADOR */
#controls{
  position:absolute;
  inset:0;
  pointer-events:none;
}

#dpad{
  position:absolute;
  left:4%;
  bottom:5%;
  width:150px;
  height:150px;
  pointer-events:auto;
}

.pad{
  position:absolute;
  width:52px;
  height:52px;
  border:3px solid #777;
  border-radius:9px;
  background:linear-gradient(#444,#222);
  color:white;
  font-size:27px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 0 #111;
  touch-action:none;
}

.pad:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #111;
  background:#666;
}

#up{left:49px;top:0}
#down{left:49px;bottom:0}
#left{left:0;top:49px}
#right{right:0;top:49px}

#actionButtons{
  position:absolute;
  right:4%;
  bottom:6%;
  width:145px;
  height:100px;
  pointer-events:auto;
}

.action{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  border:4px solid #777;
  background:linear-gradient(#555,#222);
  color:white;
  font-size:25px;
  font-weight:bold;
  box-shadow:0 5px 0 #111;
  touch-action:none;
}

.action:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #111;
}

#btnA{
  right:0;
  top:5px;
}

#btnB{
  left:5px;
  bottom:0;
}

/* BOTÕES EXTRAS */
#extraButtons{
  position:absolute;
  right:4%;
  top:5%;
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.extra{
  border:2px solid #777;
  background:#222;
  color:white;
  padding:7px 10px;
  border-radius:7px;
  font-weight:bold;
  touch-action:none;
}

/* ESCONDE CONTROLES NO MENU */
.hideControls{
  display:none!important;
}
</style>
</head>

<body>

<div id="gameWrap">

<canvas id="game" width="480" height="320"></canvas>

<div id="controls">

  <div id="dpad">
    <div class="pad" id="up">▲</div>
    <div class="pad" id="down">▼</div>
    <div class="pad" id="left">◀</div>
    <div class="pad" id="right">▶</div>
  </div>

  <div id="actionButtons">
    <button class="action" id="btnA">A</button>
    <button class="action" id="btnB">B</button>
  </div>

  <div id="extraButtons">
    <button class="extra" id="inventoryBtn">I</button>
  </div>

</div>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=480;
const H=320;

let state="menu";

const keys={
  up:false,
  down:false,
  left:false,
  right:false
};

let player={
  x:240,
  y:180,
  speed:2,
  hp:100,
  maxHp:100,
  mana:30,
  maxMana:30,
  level:1,
  xp:0,
  nextXP:40,
  attack:12,
  defense:4,
  gold:30,
  potions:3,
  sword:0,
  armor:0
};

let enemies=[
  {x:120,y:100,type:"Goblin",hp:35,maxHp:35,attack:7,xp:15,gold:8},
  {x:360,y:90,type:"Lobo",hp:30,maxHp:30,attack:8,xp:13,gold:6},
  {x:150,y:260,type:"Bandido",hp:50,maxHp:50,attack:10,xp:22,gold:15},
  {x:390,y:245,type:"Orc",hp:80,maxHp:80,attack:14,xp:35,gold:25}
];

let enemy=null;
let message="";

function rect(x,y,w,h,c){
  ctx.fillStyle=c;
  ctx.fillRect(Math.floor(x),Math.floor(y),w,h);
}

function text(t,x,y,size=12,c="#fff"){
  ctx.fillStyle=c;
  ctx.font=size+"px monospace";
  ctx.fillText(t,x,y);
}

function bar(x,y,w,h,value,max,color){
  rect(x,y,w,h,"#222");
  rect(x,y,w*Math.max(0,value/max),h,color);
  ctx.strokeStyle="#000";
  ctx.strokeRect(x,y,w,h);
}

function drawMenu(){
  rect(0,0,W,H,"#111");

  text("MEDIEVAL RPG",105,80,30,"#e8c46a");
  text("PIXEL ADVENTURE",145,105,12,"#aaa");

  rect(140,145,200,48,"#292929");
  text("A - JOGAR",185,175,18,"#fff");

  text("Controles",190,225,13,"#e8c46a");
  text("D-PAD = MOVER",155,245,11,"#aaa");
  text("A = AÇÃO / B = VOLTAR",125,263,11,"#aaa");

  text("Toque em A para começar",140,295,11,"#777");
}

function drawWorld(){
  rect(0,0,W,H,"#4c8a3d");

  /* água */
  rect(0,0,480,38,"#3478a8");
  for(let x=0;x<480;x+=24){
    rect(x,15,14,2,"#65a9cf");
  }

  /* estrada */
  rect(0,145,480,55,"#b69b6d");
  rect(215,38,50,107,"#b69b6d");
  rect(215,200,50,120,"#b69b6d");

  /* vila */
  rect(25,65,70,55,"#9c5c35");
  rect(32,58,56,15,"#69391f");
  rect(48,88,20,32,"#49301f");

  /* castelo */
  rect(355,45,95,80,"#777");
  rect(365,30,20,95,"#666");
  rect(420,30,20,95,"#666");
  rect(350,30,110,15,"#555");
  rect(390,85,25,40,"#382a24);

  /* árvores */
  const trees=[
    [30,220],[70,250],[105,215],
    [315,225],[350,270],[440,205]
  ];

  for(const [x,y] of trees){
    rect(x+8,y+18,8,22,"#654321");
    rect(x,y,25,25,"#1f632f");
    rect(x+5,y-7,18,18,"#28753a");
  }

  /* inimigos */
  for(const e of enemies){
    if(e.hp<=0) continue;

    rect(e.x-8,e.y-8,16,16,"#b22");
    rect(e.x-6,e.y-12,12,5,"#822");
    rect(e.x-5,e.y-3,3,3,"#fff");
    rect(e.x+2,e.y-3,3,3,"#fff");

    text(e.type,e.x-22,e.y-17,7,"#fff");
  }

  /* jogador */
  rect(player.x-7,player.y-10,14,18,"#234b9b");
  rect(player.x-6,player.y-17,12,8,"#e3ad78");
  rect(player.x-9,player.y-20,18,5,"#777");
  rect(player.x-12,player.y-25,24,6,"#555");

  /* HUD */
  rect(5,5,175,58,"rgba(0,0,0,.7)");
  text("Nível "+player.level,12,18,10,"#fff");
  text("HP",12,32,9,"#fff");
  bar(35,25,90,8,player.hp,player.maxHp,"#d33");

  text("MP",12,47,9,"#fff");
  bar(35,40,90,8,player.mana,player.maxMana,"#3488dd");

  text("🪙 "+player.gold,130,32,10,"#ffd34d");
  text("XP "+player.xp+"/"+player.nextXP,130,48,9,"#fff");

  text("I = Inventário",7,313,9,"#fff");
  text("L = Loja",405,313,9,"#fff");
}

function drawBattle(){
  rect(0,0,W,H,"#182033");

  text("BATALHA",185,35,22,"#e8c46a");

  /* jogador */
  rect(90,155,45,55,"#234b9b");
  rect(100,137,25,22,"#e3ad78");
  rect(94,132,37,8,"#666");
  text("HERÓI",85,230,11,"#fff");

  /* inimigo */
  rect(350,145,45,55,"#a52b2b");
  rect(355,125,35,25,"#782020");
  rect(347,118,50,10,"#541616");
  text(enemy.type,335,230,11,"#fff");

  text("HP",75,250,10,"#fff");
  bar(100,242,100,10,player.hp,player.maxHp,"#d33");

  text("HP",315,250,10,"#fff");
  bar(340,242,100,10,enemy.hp,enemy.maxHp,"#d33");

  rect(55,270,370,38,"#222");

  text("A = ATACAR",70,293,11,"#fff");
  text("B = POÇÃO",190,293,11,"#6bd");
  text("2 = ESPECIAL",310,293,10,"#f8d35b");

  if(message){
    rect(90,70,300,35,"#111");
    text(message,110,92,11,"#fff");
  }
}

function drawInventory(){
  drawWorld();

  rect(55,45,370,230,"#171717");
  ctx.strokeStyle="#d6b35d";
  ctx.strokeRect(55,45,370,230);

  text("INVENTÁRIO",155,72,22,"#e8c46a");

  text("Nível: "+player.level,80,105);
  text("HP: "+player.hp+"/"+player.maxHp,80,125);
  text("Mana: "+player.mana+"/"+player.maxMana,80,145);
  text("Ataque: "+player.attack,80,165);
  text("Defesa: "+player.defense,80,185);
  text("Poções: "+player.potions,80,205);
  text("Ouro: "+player.gold,80,225);

  text("B = VOLTAR",315,255,11,"#aaa");
}

function drawShop(){
  drawWorld();

  rect(60,45,360,230,"#171717");
  ctx.strokeStyle="#d6b35d";
  ctx.strokeRect(60,45,360,230);

  text("LOJA",190,72,22,"#e8c46a");

  text("A = Poção   15 ouro",90,115,13);
  text("1 = Espada  80 ouro",90,145,13);
  text("2 = Armadura 70 ouro",90,175,13);

  text("Ouro: "+player.gold,90,215,13,"#ffd34d");
  text("B = VOLTAR",315,255,11,"#aaa");
}

function startGame(){
  state="world";
  message="";
}

function attack(){
  if(state==="menu"){
    startGame();
    return;
  }

  if(state==="battle"){
    const damage=Math.max(1,player.attack-Math.floor(Math.random()*4));
    enemy.hp-=damage;
    message="Você causou "+damage+" de dano!";

    if(enemy.hp<=0){
      player.xp+=enemy.xp;
      player.gold+=enemy.gold;
      message="Vitória! +"+enemy.xp+" XP";

      checkLevel();
      state="world";
      enemy=null;
      save();
      return;
    }

    enemyAttack();
  }
}

function special(){
  if(state!=="battle") return;

  if(player.mana<10){
    message="Mana insuficiente!";
    return;
  }

  player.mana-=10;

  const damage=player.attack+10;
  enemy.hp-=damage;

  message="Golpe especial! "+damage+" de dano!";

  if(enemy.hp<=0){
    player.xp+=enemy.xp;
    player.gold+=enemy.gold;
    checkLevel();
    state="world";
    enemy=null;
    save();
    return;
  }

  enemyAttack();
}

function usePotion(){
  if(state==="battle"){
    if(player.potions<=0){
      message="Sem poções!";
      return;
    }

    player.potions--;
    player.hp=Math.min(player.maxHp,player.hp+35);
    message="Você recuperou 35 HP!";
    enemyAttack();
  }
}

function enemyAttack(){
  if(!enemy) return;

  const damage=Math.max(
    1,
    enemy.attack-player.defense+Math.floor(Math.random()*3)
  );

  player.hp-=damage;

  if(player.hp<=0){
    player.hp=player.maxHp;
    player.mana=player.maxMana;
    player.gold=Math.floor(player.gold/2);
    state="world";
    enemy=null;
    message="Você foi derrotado!";
    save();
  }
}

function checkLevel(){
  while(player.xp>=player.nextXP){
    player.xp-=player.nextXP;
    player.level++;
    player.nextXP=Math.floor(player.nextXP*1.5);
    player.maxHp+=15;
    player.hp=player.maxHp;
    player.maxMana+=5;
    player.mana=player.maxMana;
    player.attack+=3;
    player.defense+=1;
  }
}

function move(){
  if(state!=="world") return;

  let dx=0;
  let dy=0;

  if(keys.left) dx-=1;
  if(keys.right) dx+=1;
  if(keys.up) dy-=1;
  if(keys.down) dy+=1;

  if(dx!==0 && dy!==0){
    dx*=0.7;
    dy*=0.7;
  }

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

  player.x=Math.max(10,Math.min(W-10,player.x));
  player.y=Math.max(45,Math.min(H-15,player.y));

  for(const e of enemies){
    if(e.hp<=0) continue;

    const d=Math.hypot(player.x-e.x,player.y-e.y);

    if(d<20){
      enemy=e;
      state="battle";
      message="";
      break;
    }
  }
}

function save(){
  localStorage.setItem("MedievalRPG_Save",JSON.stringify(player));
}

function openInventory(){
  if(state==="world") state="inventory";
}

function closeScreen(){
  if(state==="inventory" || state==="shop"){
    state="world";
  }
}

function shopAction(n){
  if(state!=="shop") return;

  if(n===0){
    if(player.gold>=15){
      player.gold-=15;
      player.potions++;
    }
  }

  if(n===1){
    if(player.gold>=80){
      player.gold-=80;
      player.attack+=5;
      player.sword++;
    }
  }

  if(n===2){
    if(player.gold>=70){
      player.gold-=70;
      player.defense+=4;
      player.armor++;
    }
  }

  save();
}

function gameLoop(){
  move();

  if(state==="menu") drawMenu();
  else if(state==="world") drawWorld();
  else if(state==="battle") drawBattle();
  else if(state==="inventory") drawInventory();
  else if(state==="shop") drawShop();

  document.getElementById("controls")
    .classList.toggle("hideControls",state==="menu");

  requestAnimationFrame(gameLoop);
}

/* TECLADO */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp" || e.key.toLowerCase()==="w") keys.up=true;
  if(e.key==="ArrowDown" || e.key.toLowerCase()==="s") keys.down=true;
  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a") keys.left=true;
  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d") keys.right=true;

  if(e.key==="Enter" && state==="menu") startGame();

  if(e.key.toLowerCase()==="i") openInventory();

  if(e.key==="Escape") closeScreen();

  if(e.key==="1"){
    if(state==="battle") attack();
    if(state==="shop") shopAction(1);
  }

  if(e.key==="2"){
    if(state==="battle") special();
    if(state==="shop") shopAction(2);
  }

  if(e.key==="3" && state==="battle") usePotion();

  if(e.key.toLowerCase()==="l" && state==="world"){
    state="shop";
  }
});

document.addEventListener("keyup",e=>{
  if(e.key==="ArrowUp" || e.key.toLowerCase()==="w") keys.up=false;
  if(e.key==="ArrowDown" || e.key.toLowerCase()==="s") keys.down=false;
  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a") keys.left=false;
  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d") keys.right=false;
});

/* D-PAD */
function holdButton(id,key){
  const el=document.getElementById(id);

  const on=ev=>{
    ev.preventDefault();
    keys[key]=true;
  };

  const off=ev=>{
    ev.preventDefault();
    keys[key]=false;
  };

  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("pointerleave",off);
}

holdButton("up","up");
holdButton("down","down");
holdButton("left","left");
holdButton("right","right");

/* A */
document.getElementById("btnA").addEventListener("pointerdown",e=>{
  e.preventDefault();
  attack();
});

/* B */
document.getElementById("btnB").addEventListener("pointerdown",e=>{
  e.preventDefault();

  if(state==="battle"){
    usePotion();
  }else{
    closeScreen();
  }
});

/* INVENTÁRIO */
document.getElementById("inventoryBtn").addEventListener("pointerdown",e=>{
  e.preventDefault();
  openInventory();
});

/* INICIAR */
canvas.addEventListener("pointerdown",()=>{
  if(state==="menu") startGame();
});

gameLoop();
</script>

</body>
</html>
