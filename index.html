<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MedievalRPG</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

#game{
  width:100vw;
  height:100dvh;
  image-rendering:pixelated;
  object-fit:contain;
  background:#111;
}

#rotate{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:#080808;
  color:white;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  font-size:24px;
}

#rotate .phone{
  font-size:70px;
  margin-bottom:20px;
}

@media(max-width:700px) and (orientation:portrait){
  #game,#controls,#topInfo{
    display:none!important;
  }

  #rotate{
    display:flex;
  }
}

#controls{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
}

#dpad{
  position:absolute;
  left:20px;
  bottom:20px;
  width:180px;
  height:150px;
  pointer-events:auto;
}

.pad{
  position:absolute;
  width:58px;
  height:50px;
  border:2px solid #aaa;
  border-radius:9px;
  background:rgba(15,15,15,.85);
  color:#fff;
  font-size:23px;
}

#up{left:61px;top:0}
#down{left:61px;bottom:0}
#left{left:0;top:50px}
#right{right:0;top:50px}

#actionButtons{
  position:absolute;
  right:20px;
  bottom:20px;
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.gameButton{
  width:70px;
  height:70px;
  border-radius:50%;
  border:3px solid #fff;
  color:#fff;
  font-weight:bold;
  background:#333;
  font-size:17px;
}

#aBtn{
  background:#9b2929;
}

#bBtn{
  background:#294f9b;
}

#battleButtons{
  display:none;
  position:absolute;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  width:min(94vw,700px);
  gap:8px;
  pointer-events:auto;
}

.attackButton{
  flex:1;
  min-height:62px;
  border:2px solid #fff;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  font-size:13px;
  background:#252525;
}

#attack1{
  background:#236b35;
}

#attack2{
  background:#805322;
}

#potionButton{
  background:#672b80;
}

#topInfo{
  position:fixed;
  top:7px;
  left:7px;
  z-index:30;
  color:#fff;
  font-size:12px;
  text-shadow:2px 2px #000;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="rotate">
  <div class="phone">📱↔️</div>
  VIRE O CELULAR DE LADO<br>
  PARA JOGAR MEDIEVAL RPG
</div>

<canvas id="game" width="640" height="360"></canvas>

<div id="topInfo"></div>

<div id="controls">

  <div id="dpad">
    <button class="pad" id="up">▲</button>
    <button class="pad" id="left">◀</button>
    <button class="pad" id="right">▶</button>
    <button class="pad" id="down">▼</button>
  </div>

  <div id="actionButtons">
    <button class="gameButton" id="bBtn">B</button>
    <button class="gameButton" id="aBtn">A</button>
  </div>

  <!-- ATAQUES DA CLASSE -->
  <div id="battleButtons">
    <button class="attackButton" id="attack1">
      ⚔️ GOLPE
    </button>

    <button class="attackButton" id="attack2">
      🛡️ ATAQUE PESADO
    </button>

    <button class="attackButton" id="potionButton">
      🧪 POÇÃO
    </button>
  </div>

</div>

  defense:8,

const missions=[

/* =========================
   SAVE
========================= */

function saveGame(){

  localStorage.setItem(
    "MedievalRPG_Save",
    JSON.stringify({
      player:player,
      city:city
    })
  );

}


function loadGame(){

  try{

    const save=
      JSON.parse(
        localStorage.getItem("MedievalRPG_Save")
      );

    if(save){

      player=save.player;
      city=save.city||0;

    }

  }catch(e){}

}


/* =========================
   FULLSCREEN
========================= */

function fullscreen(){

  try{

    if(document.documentElement.requestFullscreen){

      document.documentElement.requestFullscreen();

    }

  }catch(e){}

  try{

    if(screen.orientation &&
       screen.orientation.lock){

      screen.orientation.lock("landscape");

    }

  }catch(e){}

}


/* =========================
   DESENHO
========================= */

function clear(){

  ctx.clearRect(0,0,W,H);

}


function rect(x,y,w,h,color){

  ctx.fillStyle=color;
  ctx.fillRect(x,y,w,h);

}


function txt(t,x,y,size,color="#fff",align="left"){

  ctx.fillStyle=color;
  ctx.font=`bold ${size}px Arial`;
  ctx.textAlign=align;
  ctx.fillText(t,x,y);

}


function bar(x,y,w,h,value,max,color){

  rect(x,y,w,h,"#171717");

  rect(
    x,
    y,
    w*Math.max(0,Math.min(1,value/max)),
    h,
    color
  );

  ctx.strokeStyle="#fff";
  ctx.strokeRect(x,y,w,h);

}


/* =========================
   PERSONAGEM PIXEL
========================= */

function drawCharacter(x,y,type,scale=1){

  const c=classes[type];

  const s=scale;

  /* cabeça */

  rect(
    x-9*s,
    y-28*s,
    18*s,
    18*s,
    "#efbb86"
  );

  /* cabelo */

  if(type==="mage"){

    rect(
      x-11*s,
      y-31*s,
      22*s,
      7*s,
      "#27203a"
    );

  }else{

    rect(
      x-10*s,
      y-31*s,
      20*s,
      6*s,
      "#422818"
    );

  }

  /* corpo */

  rect(
    x-11*s,
    y-8*s,
    22*s,
    27*s,
    c.color
  );

  /* braços */

  rect(
    x-18*s,
    y-7*s,
    7*s,
    21*s,
    c.color
  );

  rect(
    x+11*s,
    y-7*s,
    7*s,
    21*s,
    c.color
  );

  /* pernas */

  rect(
    x-9*s,
    y+19*s,
    7*s,
    18*s,
    "#292929"
  );

  rect(
    x+2*s,
    y+19*s,
    7*s,
    18*s,
    "#292929"
  );


  /* espada */

  if(type==="warrior"){

    rect(
      x+16*s,
      y-16*s,
      4*s,
      34*s,
      "#ddd"
    );

    rect(
      x+11*s,
      y+8*s,
      14*s,
      4*s,
      "#74421e"
    );

  }


  /* arco */

  if(type==="archer"){

    ctx.strokeStyle="#c38b45";
    ctx.lineWidth=2*s;

    ctx.beginPath();

    ctx.arc(
      x+18*s,
      y+2*s,
      15*s,
      -1.2,
      1.2
    );

    ctx.stroke();

    rect(
      x+16*s,
      y+1*s,
      22*s,
      2*s,
      "#eee"
    );

  }


  /* cajado */

  if(type==="mage"){

    rect(
      x+15*s,
      y-25*s,
      4*s,
      42*s,
      "#70431f"
    );

    rect(
      x+11*s,
      y-28*s,
      12*s,
      9*s,
      "#a95cff"
    );

  }

}


/* =========================
   INIMIGOS
========================= */

function drawEnemy(e){

  let color="#5da43b";

  if(e.name==="Lobo")
    color="#777";

  if(e.name==="Bandido")
    color="#75442b";

  if(e.name==="Orc")
    color="#47833c";

  if(e.name==="Sombra")
    color="#282335";

  if(e.name==="Senhor Sombrio")
    color="#9c2525";


  rect(
    e.x-13,
    e.y-25,
    26,
    20,
    color
  );

  rect(
    e.x-18,
    e.y-5,
    36,
    30,
    color
  );

  rect(
    e.x-11,
    e.y+25,
    8,
    15,
    "#222"
  );

  rect(
    e.x+3,
    e.y+25,
    8,
    15,
    "#222"
  );

  rect(
    e.x-8,
    e.y-18,
    5,
    5,
    "#fff"
  );

  rect(
    e.x+3,
    e.y-18,
    5,
    5,
    "#fff"
  );

  txt(
    e.name,
    e.x,
    e.y-32,
    9,
    "#fff",
    "center"
  );

}

========================= */

  );

/* =========================
   INIMIGOS DO MAPA
========================= */

function createEnemies(){

  enemies=[];

  for(let i=0;i<6;i++){

    const base=
      cities[city].enemies[
        Math.floor(
          Math.random()*
          cities[city].enemies.length
        )
      ];

    enemies.push({

      name:base.name,
      hp:base.hp,
      attack:base.attack,
      gold:base.gold,
      xp:base.xp,

      maxHp:base.hp,

      x:70+Math.random()*510,
      y:120+Math.random()*150,

      alive:true

    });

  }

}

/* =========================

========================= */

  txt(
    player.missionKills+
    " / "+
    m.need,
    W/2,
    185,
    26,
    "#6cff77",
    "center"
  );

  txt(
    "Recompensa: "+
    m.reward+
    " moedas",
    W/2,
    220,
    15,
    "#efbd56",
    "center"
  );

  txt(
    "A = aceitar     B = voltar",
    W/2,
    305,
    15,
    "#fff",
    "center"
  );

}

/* =========================
   BOTÕES DE BATALHA
========================= */

function updateBattleButtons(){

  const panel=
    document.getElementById("battleButtons");

  if(state!=="battle"){

    panel.style.display="none";
    return;

  }


  panel.style.display="flex";


  const b1=
    document.getElementById("attack1");

  const b2=
    document.getElementById("attack2");


  if(player.class==="warrior"){

    b1.textContent=
      "⚔️ GOLPE";

    b2.textContent=
      "🛡️ ATAQUE PESADO";

  }


  if(player.class==="archer"){

    b1.textContent=
      "🏹 ATIRAR";

    b2.textContent=
      "🎯 TIRO PRECISO";

  }


  if(player.class==="mage"){

    b1.textContent=
      "✨ RAIO";

    b2.textContent=
      "🔥 BOLA DE FOGO";

  }

}


/* =========================
   ATAQUE NORMAL
========================= */

function basicAttack(){

  if(state!=="battle")
    return;


  let damage=
    player.attack;


  /* GUERREIRO */

  if(player.class==="warrior"){

    damage=
      player.attack;

  }


  /* ARQUEIRO */

  if(player.class==="archer"){

    if(player.arrows<=0){

      showMessage(
        "Você está sem flechas!"
      );

      return;

    }

    player.arrows--;

    damage=
      player.attack+5;

  }


  /* MAGO */

  if(player.class==="mage"){

    damage=
      player.attack+3;

  }


  battleEnemy.hp-=damage;


  showMessage(
    "Você causou "+
    damage+
    " de dano!"
  );


  if(battleEnemy.hp<=0){

    victory();
    return;

  }


  setTimeout(
    enemyAttack,
    450
  );

}


/* =========================
   ATAQUE ESPECIAL
========================= */

function specialAttack(){

  if(state!=="battle")
    return;


  let damage=0;


  /* GUERREIRO */

  if(player.class==="warrior"){

    if(player.mana<10){

      showMessage(
        "Mana insuficiente!"
      );

      return;

    }

    player.mana-=10;

    damage=
      player.attack+18;

  }


  /* ARQUEIRO */

  if(player.class==="archer"){

    if(player.arrows<2){

      showMessage(
        "Precisa de 2 flechas!"
      );

      return;

    }

    if(player.mana<10){

      showMessage(
        "Mana insuficiente!"
      );

      return;

    }

    player.arrows-=2;

    player.mana-=10;

    damage=
      player.attack+30;

  }


  /* MAGO */

  if(player.class==="mage"){

    if(player.mana<20){

      showMessage(
        "Mana insuficiente!"
      );

      return;

    }

    player.mana-=20;

    damage=
      player.attack+45;

  }


  battleEnemy.hp-=damage;


  showMessage(
    "ATAQUE ESPECIAL! "+
    damage+
    " de dano!"
  );


  if(battleEnemy.hp<=0){

    victory();
    return;

  }


  setTimeout(
    enemyAttack,
    450
  );

}


/* =========================
   POÇÃO
========================= */

function usePotion(){

  if(state!=="battle")
    return;


  if(player.potions<=0){

    showMessage(
      "Você não tem poções!"
    );

    return;

  }


  if(player.hp>=player.maxHp){

    showMessage(
      "Seu HP já está cheio!"
    );

    return;

  }


  player.potions--;


  const heal=45;


  player.hp=
    Math.min(
      player.maxHp,
      player.hp+heal
    );


  showMessage(
    "Você recuperou "+
    heal+
    " HP!"
  );


  setTimeout(
    enemyAttack,
    450
  );

}


/* =========================
   ATAQUE DO INIMIGO
========================= */

function enemyAttack(){

  if(state!=="battle")
    return;


  const damage=
    Math.max(
      1,
      battleEnemy.attack-
      player.defense
    );


  player.hp-=damage;


  showMessage(
    battleEnemy.name+
    " causou "+
    damage+
    " de dano!"
  );


  if(player.hp<=0){

    player.hp=
      player.maxHp;

    player.mana=
      player.maxMana;

    player.gold=
      Math.max(
        0,
        player.gold-20
      );

    state="world";

    showMessage(
      "Você foi derrotado!"
    );

  }


  saveGame();

}


/* =========================
   VITÓRIA
========================= */

function victory(){

  const e=
    battleEnemy;


  player.gold+=
    e.gold;

  player.xp+=
    e.xp;


  checkMission(
    e.name
  );


  levelUp();


  showMessage(
    "VITÓRIA! +"+
    e.gold+
    " moedas  +"+
    e.xp+
    " XP"
  );


  state="world";

  battleEnemy=null;

  createEnemies();

  saveGame();

}


/* =========================
   MISSÃO
========================= */

function checkMission(enemyName){

  const m=
    missions[player.mission];


  if(!m)
    return;


  if(enemyName!==m.target)
    return;


  player.missionKills++;


  if(
    player.missionKills>=
    m.need
  ){

    player.gold+=
      m.reward;

    player.mission++;

    player.missionKills=0;

    showMessage(
      "MISSÃO COMPLETA! +"+
      m.reward+
      " moedas"
    );

  }

}


/* =========================
   LEVEL UP
========================= */

function levelUp(){

  while(
    player.xp>=
    player.nextXp
  ){

    player.xp-=
      player.nextXp;

    player.level++;

    player.nextXp=
      Math.floor(
        player.nextXp*1.5
      );


    player.maxHp+=15;

    player.hp=
      player.maxHp;


    player.maxMana+=10;

    player.mana=
      player.maxMana;


    player.attack+=3;

    player.defense+=1;


    showMessage(
      "LEVEL UP! NÍVEL "+
      player.level
    );

  }

}


/* =========================
   MENSAGEM
========================= */

function showMessage(t){

  message=t;

  messageTimer=150;

}


/* =========================
   INTERAÇÃO
========================= */

function interact(){

  if(state!=="world")
    return;


  /* inimigo */

  for(const e of enemies){

    if(
      e.alive &&
      Math.abs(
        e.x-player.x
      )<30 &&
      Math.abs(
        e.y-player.y
      )<35
    ){

      e.alive=false;

      startBattle(e);

      return;

    }

  }


  /* mestre */

  if(
    Math.abs(
      player.x-150
    )<45 &&
    Math.abs(
      player.y-160
    )<55
  ){

    state="mission";

    return;

  }


  /* portal */

  if(player.x>535){

    city=
      (city+1)%
      cities.length;

    player.x=70;

    createEnemies();

    showMessage(
      "Você chegou em "+
      cities[city].name
    );

  }

}


/* =========================
   COMEÇAR BATALHA
========================= */

function startBattle(e){

  battleEnemy={
    ...e,
    hp:e.hp,
    maxHp:e.hp
  };

  state="battle";

  updateBattleButtons();

}


/* =========================
   ESCOLHER CLASSE
========================= */

function chooseClass(type){

  const c=
    classes[type];


  player.class=
    type;


  player.maxHp=
    c.hp;

  player.hp=
    c.hp;


  player.maxMana=
    c.mana;

  player.mana=
    c.mana;


  player.attack=
    c.attack;

  player.defense=
    c.defense;


  if(type==="archer")
    player.arrows=20;


  player.x=100;
  player.y=220;


  createEnemies();


  state="world";


  saveGame();

}


/* =========================
   MOVIMENTO
========================= */

function move(dx,dy){

  if(state!=="world")
    return;


  player.x+=dx;
  player.y+=dy;


  player.x=
    Math.max(
      20,
      Math.min(
        620,
        player.x
      )
    );


  player.y=
    Math.max(
      100,
      Math.min(
        305,
        player.y
      )
    );

}


/* =========================
   UPDATE
========================= */

function update(){

  if(messageTimer>0)
    messageTimer--;


  if(state==="world"){

    if(keys.up)
      move(0,-2.5);

    if(keys.down)
      move(0,2.5);

    if(keys.left)
      move(-2.5,0);

    if(keys.right)
      move(2.5,0);

  }

}


/* =========================
   DRAW
========================= */

function draw(){

  if(state==="menu")
    drawMenu();

  else if(state==="class")
    drawClass();

  else if(state==="world")
    drawWorld();

  else if(state==="mission")
    drawMission();

  else if(state==="battle")
    drawBattle();


  updateBattleButtons();


  if(messageTimer>0){

    rect(
      100,
      95,
      440,
      43,
      "rgba(0,0,0,.88)"
    );

    txt(
      message,
      W/2,
      122,
      14,
      "#fff",
      "center"
    );

  }

}


/* =========================
   TECLADO
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowUp" ||
      e.key==="w"
    )
      keys.up=true;


    if(
      e.key==="ArrowDown" ||
      e.key==="s"
    )
      keys.down=true;


    if(
      e.key==="ArrowLeft" ||
      e.key==="a"
    )
      keys.left=true;


    if(
      e.key==="ArrowRight" ||
      e.key==="d"
    )
      keys.right=true;


    if(e.key==="Enter"){

      fullscreen();


      if(state==="menu"){

        state="class";

      }

      else if(state==="world"){

        interact();

      }

      else if(state==="mission"){

        state="world";

      }

    }


    /* CLASSES */

    if(state==="class"){

      if(e.key==="1")
        chooseClass("warrior");

      if(e.key==="2")
        chooseClass("archer");

      if(e.key==="3")
        chooseClass("mage");

    }


    /* BATALHA */

    if(state==="battle"){

      if(e.key==="1")
        basicAttack();

      if(e.key==="2")
        specialAttack();

      if(e.key==="3")
        usePotion();

    }


    if(e.key==="Escape"){

      if(state==="battle" ||
         state==="mission"){

        state="world";

      }

      else if(state==="class"){

        state="menu";

      }

    }

  }
);


document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowUp" ||
      e.key==="w"
    )
      keys.up=false;


    if(
      e.key==="ArrowDown" ||
      e.key==="s"
    )
      keys.down=false;


    if(
      e.key==="ArrowLeft" ||
      e.key==="a"
    )
      keys.left=false;


    if(
      e.key==="ArrowRight" ||
      e.key==="d"
    )
      keys.right=false;

  }
);


/* =========================
   BOTÃO A
========================= */

document
.getElementById("aBtn")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    fullscreen();


    if(state==="menu"){

      state="class";
      return;

    }


    if(state==="class"){

      chooseClass("warrior");
      return;

    }


    if(state==="world"){

      interact();
      return;

    }


    if(state==="mission"){

      state="world";
      return;

    }

  }
);


/* =========================
   BOTÃO B
========================= */

document
.getElementById("bBtn")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();


    if(
      state==="battle" ||
      state==="mission"
    ){

      state="world";
      return;

    }


    if(state==="class"){

      state="menu";

    }

  }
);


/* =========================
   ATAQUES TOUCH
========================= */

document
.getElementById("attack1")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    basicAttack();

  }
);


document
.getElementById("attack2")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    specialAttack();

  }
);


document
.getElementById("potionButton")
.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    usePotion();

  }
);


/* =========================
   DIRECIONAIS TOUCH
========================= */

function bindDirection(id,key){

  const button=
    document.getElementById(id);


  button.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      keys[key]=true;

    }
  );


  button.addEventListener(
    "pointerup",
    e=>{

      e.preventDefault();

      keys[key]=false;

    }
  );


  button.addEventListener(
    "pointercancel",
    ()=>{
      keys[key]=false;
    }
  );


  button.addEventListener(
    "pointerleave",
    ()=>{
      keys[key]=false;
    }
  );

}


bindDirection("up","up");
bindDirection("down","down");
bindDirection("left","left");
bindDirection("right","right");


/* =========================
   MOVIMENTO DOS INIMIGOS
========================= */

setInterval(()=>{

  if(state!=="world")
    return;


  for(const e of enemies){

    if(!e.alive)
      continue;


    const dx=
      player.x-e.x;

    const dy=
      player.y-e.y;

    const distance=
      Math.sqrt(
        dx*dx+
        dy*dy
      );


    if(
      distance<100 &&
      distance>35
    ){

      e.x+=
        dx/distance*.25;

      e.y+=
        dy/distance*.25;

    }

  }

},30);


/* =========================
   LOOP
========================= */

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);

}


loadGame();

createEnemies();

loop();

</script>
